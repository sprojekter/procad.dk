# Forhåndsvisning på GitHub Pages (sprojekter.github.io/procad.dk/) – kun manuelt.
# Den rigtige side bygges af deploy-simply.yml. Forhåndsvisningen er noindex.
# Kør: Actions → "Forhåndsvisning (GitHub Pages)" → Run workflow.
name: Forhåndsvisning (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installér afhængigheder
        run: npm install --no-audit --no-fund

      - name: Hent fotos lokalt
        run: npm run photos

      # Med eget domæne (public/CNAME) ligger sitet i roden.
      # Uden ligger det under /<repo-navn>/ på sprojekter.github.io.
      - name: Find base-sti
        run: |
          if [ -f public/CNAME ]; then
            echo "SITE_BASE=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          fi

      - name: Byg sitet
        run: npm run build
        env:
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_NOINDEX: 'true'

      - name: Tilpas links til base-sti
        run: node scripts/apply-base.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
